# Training pipeline settings. Results are only reportable above min_train_days.
min_train_days: 60
seed: 20261015
# 0.05, 0.25, 0.75 and 0.95 give the predictive distribution for the connection simulator; the
# 80% interval and its CQR offsets still use 0.1 and 0.9
quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
interval: [0.1, 0.9]
nominal_coverage: 0.8
# with at least this many validation days, validation is split in two by date: the first half
# tunes and early-stops, the second half calibrates (conformal offsets, band calibration)
split_validation_min_days: 10
num_threads: 2
# candidate targets: the delay itself, or the delay minus the lateness at T (persistence as floor).
# Each is fitted with its own grid and the better one is kept per horizon by tuning pinball loss.
targets: [direct, residual]
# Mondrian CQR: offsets per horizon and observed lateness group at T (not started, 0-4, 5-14, 15+).
# A group with fewer than min_rows calibration rows is merged into its neighbour and logged.
mondrian:
  min_rows: 30
max_rounds: 400
early_stopping_rounds: 30
# 12 combinations, chosen by validation pinball loss. Strong regularisation on purpose.
grid:
  num_leaves: [4, 8, 16]
  min_data_in_leaf: [20, 60]
  learning_rate: [0.03, 0.1]
  feature_fraction: [0.8]
fixed:
  lambda_l2: 10.0
  max_depth: 5
  bagging_fraction: 0.8
  bagging_freq: 1
band_model:
  num_leaves: 4
  min_data_in_leaf: 40
  learning_rate: 0.05
  feature_fraction: 0.8
