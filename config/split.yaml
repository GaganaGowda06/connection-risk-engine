# Time-based split by service date, over complete days only.
# test is the most recent complete days, validation the block before it, train everything earlier.
# gap_days complete days are dropped between consecutive blocks.
test_days: 7
validation_days: 14
gap_days: 1
# routes whose complete days define the split and which the model trains and is scored on.
# bhm-man is still ingesting; add it when it has comparable history.
routes: [bhm-eus, ast-bhm]
# a day is complete for a route when all its hourly windows (06-22) were ingested
windows_per_day: 16
bootstrap:
  resamples: 1000
  seed: 20261015
  confidence: 0.95

# Stage 2 network split (rail_risk.baselines.split). The same sizes as above, applied to the
# complete service dates of train_pool only (oot_week and winter_test never appear). The dates
# below are what the rule gives from data/manifests/darwin_archive.csv; a test keeps them equal.
# train holds Dec 2025, Jan 2026 and 2026-07-25 to 2026-09-23 (complete days only, so there are
# no autumn days in train: the validation and test blocks are the first autumn the baselines see).
network:
  train: {first: 2025-12-01, last: 2026-09-23, days: 123}
  validation: {first: 2026-09-25, last: 2026-10-08, days: 14}
  test: {first: 2026-10-10, last: 2026-10-16, days: 7}
