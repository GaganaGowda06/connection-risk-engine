# Time-based split by service date, over complete days only.
# test is the most recent complete days, validation the block before it, train everything earlier.
# gap_days complete days are dropped between consecutive blocks.
test_days: 7
validation_days: 14
gap_days: 1
# routes whose complete days define the split and which the model trains and is scored on.
# bhm-man is still ingesting; add it when it has comparable history.
routes: [bhm-eus, ast-bhm]
# a day is complete for a route when all its hourly windows (06-22) were ingested
windows_per_day: 16
bootstrap:
  resamples: 1000
  seed: 20261015
  confidence: 0.95
