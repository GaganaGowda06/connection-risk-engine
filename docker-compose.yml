# Local stack: the risk API, the Streamlit page and an optional Darwin capture.
#   docker compose up --build api ui        # then http://127.0.0.1:8501
#   docker compose --profile capture up capture
# Ports bind to localhost only. data/ and mlruns/ are mounted read-only for api and ui. No secret
# is in an image or in this file: the capture takes its credentials from .env at run time.
name: connection-risk

services:
  api:
    build:
      context: .
      target: api
    image: rail-risk-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./mlruns:/app/mlruns:ro
    read_only: true
    tmpfs:
      # exec is needed: Spark unpacks native libraries (snappy) into /tmp and maps them
      - /tmp:exec,mode=1777,size=1g
    restart: unless-stopped

  serve:
    # Stage 6: the engine and the API in one process. It replays archive hours in message-time
    # order and answers /risk, /connection, /inbound, /health from the committed state. A killed
    # container restarts by policy and resumes from the last committed hour.
    build:
      context: .
      target: serve
    image: rail-risk-serve:latest
    profiles: [serve]
    command: >
      python -m rail_risk.serving.run --serve --split ${REPLAY_SPLIT:-train_pool}
      --start ${REPLAY_START:-2026-10-01T00:00} --end ${REPLAY_END:-2026-10-05T00:00}
      --state /app/data/interim/serve/state_${REPLAY_NAME:-validation}
      --store-root /app/data/interim/serve/store_${REPLAY_NAME:-validation}
      --die-after-hours ${REPLAY_DIE:-0} --skip ${REPLAY_SKIP:-}
      --workers ${SERVE_WORKERS:-1} ${SERVE_FLAGS:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/interim:/app/data/interim:ro
      - ./data/interim/serve:/app/data/interim/serve
      - ./data/ref:/app/data/ref:ro
      - ./config:/app/config:ro
      - ./reports/serving:/app/reports/serving:ro
      - ./reports/network_model:/app/reports/network_model:ro
    mem_limit: 5g
    # init: a real PID 1 (tini). Without it a SIGKILL sent to the server process inside the
    # container is ignored by PID 1; with it the container exits and the policy restarts it.
    # A manual `docker kill` or `docker stop` is a deliberate stop and is not restarted.
    init: true
    restart: unless-stopped
    environment:
      MLFLOW_DISABLE_AGENT_HINT: "1"

  ui:
    build:
      context: .
      target: ui
    image: rail-risk-ui:latest
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      RAIL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  capture:
    # Do not run this while a host capture is running: two consumers in one group would
    # split the partitions between them.
    profiles: [capture]
    image: rail-risk-api:latest
    command: ["python", "scripts/capture_darwin.py"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
