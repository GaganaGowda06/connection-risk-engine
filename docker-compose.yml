# Local stack. The default service is the Stage 6 network service:
#   docker compose up --build api            # API on http://127.0.0.1:8000
# It serves the replay state data/interim/serve/state_oot (the oot_week ledger) when it exists and
# otherwise the committed sample ledger in data/sample (one replay hour, see scripts/serve_entry.sh).
# It loads
# the frozen runs 1e197857 (arrival model), c0a08ab4 (calibration) and cd4ac6e9 (P(miss)) named in
# reports/. Set REPLAY_NAME, REPLAY_SPLIT, REPLAY_START, REPLAY_END and SERVE_FLAGS (empty to
# replay instead of serving an existing ledger) to run another ledger.
# The older two-route stack (Spark API and Streamlit page) is under the legacy profile:
#   docker compose --profile legacy up --build legacy-api legacy-ui     # API :8100, page :8501
# Ports bind to localhost only. No secret is in an image or in this file: the capture takes its
# credentials from .env at run time.
name: connection-risk

services:
  api:
    # Stage 6 network service (the default): the engine and the API in one process. It replays archive hours in message-time
    # order and answers /risk, /connection, /inbound, /health from the committed state. A killed
    # container restarts by policy and resumes from the last committed hour.
    build:
      context: .
      target: serve
    image: rail-risk-serve:latest
    command: ["sh", "/app/serve_entry.sh"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./scripts/serve_entry.sh:/app/serve_entry.sh:ro
      - ./data/sample:/app/data/sample:ro
      - ./data/interim:/app/data/interim:ro
      - ./data/interim/serve:/app/data/interim/serve
      - ./data/ref:/app/data/ref:ro
      - ./config:/app/config:ro
      - ./reports/serving:/app/reports/serving:ro
      - ./reports/network_model:/app/reports/network_model:ro
    mem_limit: 5g
    # init: a real PID 1 (tini). Without it a SIGKILL sent to the server process inside the
    # container is ignored by PID 1; with it the container exits and the policy restarts it.
    # A manual `docker kill` or `docker stop` is a deliberate stop and is not restarted.
    init: true
    restart: unless-stopped
    environment:
      MLFLOW_DISABLE_AGENT_HINT: "1"


  legacy-api:
    build:
      context: .
      target: api
    image: rail-risk-api:latest
    profiles: [legacy]
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./data:/app/data:ro
      - ./mlruns:/app/mlruns:ro
    read_only: true
    tmpfs:
      # exec is needed: Spark unpacks native libraries (snappy) into /tmp and maps them
      - /tmp:exec,mode=1777,size=1g
    restart: unless-stopped

  legacy-ui:
    build:
      context: .
      target: ui
    image: rail-risk-ui:latest
    profiles: [legacy]
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      RAIL_API_URL: http://legacy-api:8000
    depends_on:
      legacy-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  capture:
    # Do not run this while a host capture is running: two consumers in one group would
    # split the partitions between them.
    profiles: [capture]
    build:
      context: .
      target: api
    image: rail-risk-api:latest
    command: ["python", "scripts/capture_darwin.py"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
