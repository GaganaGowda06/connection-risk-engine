[project]
name = "rail-risk"
version = "0.1.0"
description = "Calibrated UK rail arrival-range and connection-risk service on open Darwin and HSP data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "mlflow>=3",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "pyarrow<26",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyspark>=4.2.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn>=0.30",
]

[project.scripts]
rail-risk = "rail_risk.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# the UI image installs only the ui group; the API image installs neither dev nor ui
default-groups = ["dev", "ui"]

[dependency-groups]
ui = [
    "httpx>=0.28.1",
    "streamlit>=1.66.0",
]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
