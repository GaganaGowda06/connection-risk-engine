name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run rail-risk check

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --verbose .

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          tags: rail-risk-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Write a fixture store (synthetic data and a registered model, no real data)
        run: |
          mkdir fixture && chmod 777 fixture
          docker run --rm -v "$PWD/fixture:/fixture" rail-risk-api:ci \
            python scripts/make_fixture_store.py /fixture
      - name: Run the container
        run: |
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp:exec,mode=1777 \
            -v "$PWD/fixture/data:/app/data:ro" -v "$PWD/fixture/mlruns:/app/mlruns:ro" \
            rail-risk-api:ci
      - name: Check /health
        run: |
          for i in $(seq 1 60); do
            if curl -fs localhost:8000/health -o health.json; then break; fi
            sleep 3
          done
          cat health.json
          python3 - <<'PY'
          import json
          h = json.load(open("health.json"))
          assert h["model_fallback"] is False, h
          assert h["model_alias"] == "champion" and h["model_run_id"], h
          PY
      - name: Container logs
        if: failure()
        run: docker logs api | tail -60

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint
      - name: Plan with no account (dummy values, skipped provider calls)
        env:
          AWS_ACCESS_KEY_ID: offline
          AWS_SECRET_ACCESS_KEY: offline
        run: |
          cat > offline-plan.tfvars <<'VARS'
          aws_region            = "eu-west-2"
          vpc_id                = "vpc-00000000"
          subnet_ids            = ["subnet-00000000", "subnet-11111111"]
          allowed_ingress_cidrs = ["10.0.0.0/16"]
          artefact_bucket_name  = "example-connection-risk-artefacts"
          image_tag             = "offline"
          offline_plan          = true
          VARS
          terraform plan -input=false -var-file=offline-plan.tfvars -lock=false -no-color | tail -5
